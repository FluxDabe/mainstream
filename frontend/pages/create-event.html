<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mainstream — Create event</title><link rel="stylesheet" href="../css/style.css"></head><body onload="requireAuth()"><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">M</span> Mainstream</div><div class="nav-label">Workspace</div><nav class="nav"><a href="dashboard.html">▦ <span>Dashboard</span></a><a class="active" href="create-event.html">＋ <span>New event</span></a></nav></aside><main class="main"><header class="topbar"><div class="top-title">Create event</div><a class="btn btn-ghost" href="dashboard.html">← Back</a></header><div class="content"><div class="page-head"><div><div class="eyebrow">New workspace</div><h1>Create an event</h1><p class="muted">Thiết lập thông tin cơ bản để bắt đầu quản lý.</p></div></div><section class="card"><form id="createEventForm"><div class="form-grid"><div class="field"><label>Tên event *</label><input id="name" required placeholder="Ví dụ: Tech Conference 2026"></div><div class="field"><label>Loại event</label><input id="eventType" placeholder="Conference, Workshop..."></div><div class="field"><label>Địa điểm</label><input id="location" placeholder="Hà Nội"></div><div class="field"><label>Ngày tổ chức</label><input id="eventDate" type="datetime-local"></div><div class="field"><label>Số người tham dự</label><input id="attendees" type="number" min="0" value="0"></div><div class="field"><label>Ngân sách</label><input id="budget" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Trạng thái</label><select id="status"><option>PLANNING</option><option>ONGOING</option><option>COMPLETED</option><option>CANCELLED</option></select></div><div class="field full"><label>Mô tả</label><textarea id="description" rows="5" placeholder="Mục tiêu, concept, audience..."></textarea></div></div><div id="error" class="error"></div><div class="actions" style="justify-content:flex-end;margin-top:22px"><a class="btn" href="dashboard.html">Hủy</a><button type="submit" class="btn btn-primary">Create event</button></div></form></section></div></main></div><script src="../js/api.js"></script><script src="../js/create-event.js"></script></body></html>
