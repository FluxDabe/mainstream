<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mainstream — Register</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="auth-page"><section class="auth-visual"><div class="auth-copy"><div class="brand"><span class="brand-mark">M</span> Mainstream</div><div class="eyebrow" style="color:#b9b9ff">Built for event teams</div><h1>Turn planning into execution.</h1><p>A clean workspace for events, tasks, timelines and reports.</p></div></section><section class="auth-form"><div class="auth-box"><h2>Create your account</h2><p class="muted">Bắt đầu với Mainstream.</p><form onsubmit="register(event)" style="margin-top:25px"><div class="field"><label>Họ tên</label><input id="fullName" required></div><div class="field" style="margin-top:15px"><label>Email</label><input id="email" type="email" required></div><div class="field" style="margin-top:15px"><label>Mật khẩu</label><input id="password" type="password" required></div><div id="error" class="error"></div><button class="btn btn-primary" style="width:100%;margin-top:18px">Tạo tài khoản</button></form><p class="muted" style="margin-top:20px;text-align:center">Đã có tài khoản? <a href="login.html" style="color:var(--primary);font-weight:800">Đăng nhập</a></p></div></section></div><script src="../js/api.js"></script><script src="../js/auth.js"></script></body></html>
